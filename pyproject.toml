[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "image-modifier"
version = "0.1.0"
description = "Image Modifier"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.17.2",
    "apscheduler>=3.11.1",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.119.0",
    "gunicorn>=23.0.0",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.11",
    "pwdlib[argon2]>=0.2.1",
    "pydantic-settings>=2.11.0",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.20",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.44",
    "uvicorn[standard]>=0.37.0",
    "stripe>=8.0.0",
    "google-genai>=0.3.0",
    "mediapipe>=0.10.0",
    "opencv-python-headless>=4.9.0.80",
    "numpy>=1.26.0",
    "clerk-backend-api>=4.2.0",
    "cryptography>=45.0.7",
    "svix>=1.84.1",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PL"]
ignore = ["E501"]  # Line too long violations handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "PLC0415", "S101", "F841", "E402"]
"scripts/*" = ["PLC0415", "E402", "PLR0912", "PLR0915", "E722"]
"alembic/*" = ["E402", "UP007"]

"app/core/security.py" = ["PLR0912"]
"app/dependencies/quota.py" = ["PLR0915"]
"app/routers/image.py" = ["B008", "PLR0913", "PLR0912", "PLR0915"]
"app/routers/webhook.py" = ["B904"]
"app/services/oauth_service.py" = ["PLR2004"]
"app/services/user_service.py" = ["PLR0912"]
"app/utils/response.py" = ["PLR0913"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "aiosqlite>=0.19.0",
    "pre-commit>=3.5.0",
    "commitizen>=3.13.0"
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true
