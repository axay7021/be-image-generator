[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "image-modifier"
version = "0.1.0"
description = "Image Modifier"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.17.2",
    "apscheduler>=3.11.1",
    "assemblyai>=0.48.2",
    "asyncpg>=0.31.0",
    "elevenlabs>=2.26.1",
    "email-validator>=2.3.0",
    "fastapi>=0.119.0",
    "fastmcp>=2.13.1",
    "gunicorn>=23.0.0",
    "httpx>=0.28.1",
    "livekit>=1.0.19",
    "livekit-agents[assemblyai,elevenlabs,google]>=1.3.5",
    "livekit-plugins-deepgram>=1.3.5",
    "livekit-plugins-google>=1.3.5",
    "livekit-plugins-openai>=1.3.5",
    "livekit-plugins-silero>=1.3.5",
    "psycopg2-binary>=2.9.11",
    "pwdlib[argon2]>=0.2.1",
    "pydantic-settings>=2.11.0",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.20",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.44",
    "uvicorn[standard]>=0.37.0",
    "stripe>=8.0.0",
    "google-genai>=0.3.0",
    "mediapipe>=0.10.0",
    "opencv-python-headless>=4.9.0.80",
    "numpy>=1.26.0",
    "clerk-backend-api>=4.2.0",
    "cryptography>=45.0.7",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PL"]
ignore = ["E501"]  # Line too long violations handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "PLC0415", "S101"]
"scripts/*" = ["PLC0415", "E402", "PLR0912", "PLR0915", "E722"]  # Allow loose coding in scripts

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "aiosqlite>=0.19.0"
]
